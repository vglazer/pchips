[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pchips"
version = "2.0.0"
authors = [
  { name="Victor Glazer" }
]
description = "A drop-in replacement for scipy.interpolate.PchipInterpolator using H. T. Huynh's accurate monotone cubic interpolant."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "numpy>=1.23.5",
    "scipy>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=7",
    "matplotlib>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]
